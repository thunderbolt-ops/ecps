# Temporary demo deployments using public images for testing
# These replace the actual app containers while we handle image builds
# In production, replace with actual ecps-* images

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api-demo
  namespace: team-alpha
  labels:
    app: billing-api
    team: team-alpha
    demo: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
      demo: "true"
  template:
    metadata:
      labels:
        app: billing-api
        team: team-alpha
        demo: "true"
    spec:
      containers:
        - name: billing-api
          image: kennethreitz/httpbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: GUNICORN_CMD_ARGS
              value: "--bind=0.0.0.0:80"
          readinessProbe:
            httpGet:
              path: /get
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status/200
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

