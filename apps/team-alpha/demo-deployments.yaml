---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-worker-demo
  namespace: team-alpha
  labels:
    app: jobs-worker
    team: team-alpha
    demo: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-worker
      demo: "true"
  template:
    metadata:
      labels:
        app: jobs-worker
        team: team-alpha
        demo: "true"
    spec:
      containers:
        - name: jobs-worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Demo Jobs Worker (placeholder)"
              while true; do
                echo "[$(date)] Processing background jobs..."
                sleep 30
              done
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

