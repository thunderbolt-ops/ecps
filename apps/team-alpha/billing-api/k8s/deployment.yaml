apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: team-alpha
  labels:
    app: billing-api
    team: team-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
        team: team-alpha
    spec:
      initContainers:
        - name: wait-for-dns
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for cluster DNS..."
              until nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; do
                echo "DNS not ready (kubernetes.default). Sleeping..."
                sleep 2
              done
              echo "Waiting for postgres service DNS..."
              until nslookup postgres.platform-data.svc.cluster.local >/dev/null 2>&1; do
                echo "DNS not ready (postgres svc). Sleeping..."
                sleep 2
              done
              echo "DNS OK."
    
      containers:
        - name: billing-api
          image: ecps-billing-api:0.1.0   # placeholder, we’ll adjust later
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: APP_ENV
              value: "dev"
            - name: APP_TEAM
              value: "team-alpha"

            - name: DB_HOST
              value: "postgres.platform-data.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "billing"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "dev-postgres-password"

