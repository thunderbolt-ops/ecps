apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: team-alpha
  labels:
    app: billing-api
    team: team-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
        team: team-alpha
    spec:
      containers:
        - name: billing-api
          image: ghcr.io/example-org/billing-api:0.1.0   # placeholder, we’ll adjust later
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            # We will wire these in Step 2 (Postgres, Redis, MinIO, Keycloak)
            - name: APP_ENV
              value: "dev"
            - name: APP_TEAM
              value: "team-alpha"
