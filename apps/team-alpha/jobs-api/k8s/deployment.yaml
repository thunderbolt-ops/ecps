apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  namespace: team-alpha
  labels:
    app: jobs-api
    team: team-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels:
        app: jobs-api
        team: team-alpha
    spec:
      initContainers:
        - name: wait-for-dns
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for cluster DNS..."
              until nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; do
                echo "DNS not ready (kubernetes.default). Sleeping..."
                sleep 2
              done
              echo "Waiting for postgres service DNS..."
              until nslookup postgres.platform-data.svc.cluster.local >/dev/null 2>&1; do
                echo "DNS not ready (postgres svc). Sleeping..."
                sleep 2
              done
              echo "DNS OK."
    
      containers:
        - name: jobs-api
          image: ecps-jobs-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PG_HOST
              value: "postgres.platform-data.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: "postgres"
            - name: PG_USER
              value: "postgres"
            - name: PG_PASSWORD
              value: "dev-postgres-password"
            - name: REDIS_HOST
              value: "redis.platform-data.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_ENDPOINT
              value: "minio.platform-data.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "dev-minio-password"
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_BUCKET
              value: "jobs-results"
            - name: JOB_QUEUE_KEY
              value: "jobs:queue"
