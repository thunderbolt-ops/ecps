apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobs-api
  namespace: team-alpha
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: jobs.team-alpha.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobs-api
                port:
                  number: 80
