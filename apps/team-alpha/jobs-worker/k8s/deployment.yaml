apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-worker
  namespace: team-alpha
  labels:
    app: jobs-worker
    team: team-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-worker
  template:
    metadata:
      labels:
        app: jobs-worker
        team: team-alpha
    spec:
      initContainers:
        - name: wait-for-dns
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for cluster DNS..."
              until nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; do
                echo "DNS not ready (kubernetes.default). Sleeping..."
                sleep 2
              done
              echo "Waiting for postgres service DNS..."
              until nslookup postgres.platform-data.svc.cluster.local >/dev/null 2>&1; do
                echo "DNS not ready (postgres svc). Sleeping..."
                sleep 2
              done
              echo "DNS OK."
    
      containers:
        - name: jobs-worker
          image: ecps-jobs-worker:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "main.py"]
          env:
            - name: PG_HOST
              value: postgres.platform-data.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: billing
            - name: PG_USER
              value: postgres
            - name: PG_PASSWORD
              value: dev-postgres-password

            - name: REDIS_HOST
              value: redis.platform-data.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"

            - name: MINIO_ENDPOINT
              value: minio.platform-data.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              value: minioadmin
            - name: MINIO_SECRET_KEY
              value: dev-minio-password
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_BUCKET
              value: jobs-results

            - name: JOB_QUEUE_KEY
              value: jobs:queue

          ports:
            - name: metrics
              containerPort: 8001

