apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hello-app-alerts
  namespace: platform-observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: hello-app.rules
      rules:
        # Warning: hello-app has no available replicas for > 2 minutes
        - alert: HelloAppUnavailableWarning
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"team-alpha|team-beta",
              deployment="hello-app"
            } < 1
          for: 2m
          labels:
            severity: warning
            service: hello-app
          annotations:
            summary: "Hello app unavailable (warning)"
            description: |
              hello-app in namespace {{ $labels.namespace }} has no available replicas
              for more than 2 minutes.

        # Critical: hello-app has no available replicas for > 5 minutes
        - alert: HelloAppUnavailableCritical
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"team-alpha|team-beta",
              deployment="hello-app"
            } < 1
          for: 5m
          labels:
            severity: critical
            service: hello-app
          annotations:
            summary: "Hello app unavailable (critical)"
            description: |
              hello-app in namespace {{ $labels.namespace }} has had no available replicas
              for more than 5 minutes. User-visible impact is very likely.

        # Restart burst: possible crashloop (unchanged)
        - alert: HelloAppRestartBurst
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace=~"team-alpha|team-beta",
                pod=~"hello-app-.*"
              }[5m]
            ) > 3
          for: 5m
          labels:
            severity: warning
            service: hello-app
          annotations:
            summary: "Hello app restart burst"
            description: |
              hello-app pods in namespace {{ $labels.namespace }} restarted
              more than 3 times in the last 5 minutes.

