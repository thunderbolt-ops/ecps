apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-alpha-hello
  namespace: platform-system
spec:
  project: default

  source:
    repoURL: https://github.com/thunderbolt-ops/ecps.git
    targetRevision: main
    path: apps/team-alpha/hello-app/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: team-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
