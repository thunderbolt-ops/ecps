apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-app-team-alpha-dev
  namespace: platform-system
spec:
  project: default
  source:
    repoURL: https://github.com/thunderbolt-ops/ecps.git
    targetRevision: feat/billing-platform-app
    path: apps/team-alpha/hello-app/envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: team-alpha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
